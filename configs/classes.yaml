# 조각김치 이물검출 Class 정의 (회사 제공 ID 0~6, 번호 재배치 금지)
# 프로그램 실제 설정: src/config.py 의 CLASSES — 바꿀 때는 두 곳을 함께 수정
classes:
  0:
    name: "나뭇잎·종이류"
    enabled: true
  1:
    name: "플라스틱류·돌·금속류"
    enabled: true
  2:
    name: "나뭇가지류"
    enabled: true
  3:
    name: "벌레류"
    enabled: true
  4:
    name: "고무장갑"
    enabled: false        # 이번 프로젝트에서 사용하지 않음 (목록에서 숨김)
    replace_with: 1       # 기존 라벨에 4가 있으면 1(플라스틱류·돌·금속류)로 변경 안내
  5:
    name: "병해·갈변"
    enabled: true
  6:
    name: "파·고추"
    enabled: true
